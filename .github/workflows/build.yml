name: Build Craftium

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    env:
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install signing certificate
      env:
        MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      run: |
        if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ] || [ -z "${MACOS_CERTIFICATE_PWD:-}" ]; then
          echo "Signing certificate secrets not provided. Skipping certificate installation."
          exit 0
        fi

        CERTIFICATE_PATH="$RUNNER_TEMP/apple_certificate.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

        echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

        security create-keychain -p "" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "" "$KEYCHAIN_PATH"

        security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/productsign

        security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/^[[:space:]]*//;s/"//g')
        security default-keychain -s "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"

        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -n 1 | sed -E 's/^ *[0-9]+\) [0-9A-F]+ \"(.+)\"$/\1/')
        if [ -z "$IDENTITY" ]; then
          echo "::error::No signing identity found in the imported certificate."
          exit 1
        fi

        echo "Found signing identity: $IDENTITY"
        echo "MACOS_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

        rm -f "$CERTIFICATE_PATH"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.3'
        host: 'mac'
        target: 'desktop'
        cache: true

    - name: Create build directory
      run: mkdir -p build

    - name: Configure CMake
      run: |
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Package macOS App
      run: |
        cd build
        mkdir -p Craftium.app/Contents/MacOS
        mkdir -p Craftium.app/Contents/Resources

        # Copy executable
        cp Craftium Craftium.app/Contents/MacOS/

        # Create Info.plist
        cat > Craftium.app/Contents/Info.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>Craftium</string>
            <key>CFBundleIdentifier</key>
            <string>com.spiritwise.craftium</string>
            <key>CFBundleName</key>
            <string>Craftium</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
        </dict>
        </plist>
        EOF

        # Use macdeployqt to bundle Qt dependencies
        macdeployqt Craftium.app

        # Code sign (Developer ID if provided, otherwise ad-hoc)
        if [ -n "${MACOS_CODESIGN_IDENTITY}" ]; then
          echo "Signing Craftium.app with ${MACOS_CODESIGN_IDENTITY}"
          codesign --force --deep --options runtime --sign "${MACOS_CODESIGN_IDENTITY}" Craftium.app
        else
          echo "Ad-hoc signing Craftium.app"
          codesign --force --deep --sign - Craftium.app
        fi

        # Recreate the DMG so it contains the signed app
        rm -f Craftium.dmg
        hdiutil create -volname Craftium -srcfolder Craftium.app -ov -format UDZO Craftium.dmg

        # Optionally sign the DMG when a Developer ID is available
        if [ -n "${MACOS_CODESIGN_IDENTITY}" ]; then
          codesign --force --sign "${MACOS_CODESIGN_IDENTITY}" Craftium.dmg
        fi

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
        else
          echo "version=$(date +'%Y%m%d')-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
        fi

    - name: Rename artifacts
      run: |
        cd build
        if [ -f Craftium.dmg ]; then
          mv Craftium.dmg Craftium-macOS-${{ steps.version.outputs.version }}.dmg
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Craftium-macOS-${{ steps.version.outputs.version }}
        path: |
          build/Craftium-macOS-*.dmg
          build/Craftium
        retention-days: 30

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/Craftium-macOS-*.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
