name: Continuous Build

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Create Continuous Release
    runs-on: macos-latest
    env:
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install signing certificate
      if: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' && secrets.MACOS_CERTIFICATE_PWD != '' }}
      env:
        MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      run: |
        CERTIFICATE_PATH="$RUNNER_TEMP/apple_certificate.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

        echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

        security create-keychain -p "" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "" "$KEYCHAIN_PATH"

        security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/productsign

        security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/^[[:space:]]*//;s/"//g')
        security default-keychain -s "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"

        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -n 1 | sed -E 's/^ *[0-9]+\) [0-9A-F]+ \"(.+)\"$/\1/')
        if [ -z "$IDENTITY" ]; then
          echo "::error::No signing identity found in the imported certificate."
          exit 1
        fi

        echo "Found signing identity: $IDENTITY"
        echo "MACOS_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

        rm -f "$CERTIFICATE_PATH"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.3'
        host: 'mac'
        target: 'desktop'
        cache: true

    - name: Create build directory
      run: mkdir -p build

    - name: Configure CMake
      run: |
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Package macOS App
      run: |
        cd build
        mkdir -p Craftium.app/Contents/MacOS
        mkdir -p Craftium.app/Contents/Resources

        # Copy executable
        cp Craftium Craftium.app/Contents/MacOS/

        # Create Info.plist
        cat > Craftium.app/Contents/Info.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>Craftium</string>
            <key>CFBundleIdentifier</key>
            <string>com.spiritwise.craftium</string>
            <key>CFBundleName</key>
            <string>Craftium</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.utilities</string>
        </dict>
        </plist>
        EOF

        # Use macdeployqt to bundle Qt dependencies
        macdeployqt Craftium.app

        # Code sign (Developer ID if provided, otherwise ad-hoc)
        if [ -n "${MACOS_CODESIGN_IDENTITY}" ]; then
          echo "Signing Craftium.app with ${MACOS_CODESIGN_IDENTITY}"
          codesign --force --deep --options runtime --sign "${MACOS_CODESIGN_IDENTITY}" Craftium.app
        else
          echo "Ad-hoc signing Craftium.app"
          codesign --force --deep --sign - Craftium.app
        fi

        # Recreate the DMG so it contains the signed app
        rm -f Craftium.dmg
        hdiutil create -volname Craftium -srcfolder Craftium.app -ov -format UDZO Craftium.dmg

        # Optionally sign the DMG when a Developer ID is available
        if [ -n "${MACOS_CODESIGN_IDENTITY}" ]; then
          codesign --force --sign "${MACOS_CODESIGN_IDENTITY}" Craftium.dmg
        fi

    - name: Get build info
      id: build_info
      run: |
        BUILD_DATE=$(date +'%Y%m%d-%H%M')
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        echo "build_name=continuous-${BUILD_DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
        echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
        echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

    - name: Rename artifacts
      run: |
        cd build
        if [ -f Craftium.dmg ]; then
          mv Craftium.dmg Craftium-macOS-${{ steps.build_info.outputs.build_name }}.dmg
        fi

    - name: Create or Update Continuous Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: continuous
        name: Continuous Build (Latest)
        body: |
          **Automated build from latest commit**

          Build Date: ${{ steps.build_info.outputs.build_date }}
          Commit: ${{ github.sha }}

          This is an automated build from the latest code on the main branch.

          ### Installation
          1. Download the DMG file below
          2. Open the DMG
          3. Drag Craftium.app to your Applications folder
          4. First time running: Right-click the app and select "Open" to bypass Gatekeeper
          5. Grant Accessibility and Input Monitoring permissions in System Settings → Privacy & Security

          **Note:** These are development builds and may contain bugs. For stable releases, use tagged versions.
        files: |
          build/Craftium-macOS-*.dmg
        prerelease: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts to workflow
      uses: actions/upload-artifact@v4
      with:
        name: Craftium-macOS-${{ steps.build_info.outputs.build_name }}
        path: |
          build/Craftium-macOS-*.dmg
          build/Craftium
        retention-days: 90
